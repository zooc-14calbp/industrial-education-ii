<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>教育制度と職業教育の位置づけ</title><style>text{font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic",sans-serif}</style><rect x="0" y="0" width="1600" height="1100" rx="5" fill="#F3F5F1" stroke="none" /><text x="42" y="41.6" font-size="16" fill="#246A70">工業科教育論Ⅱ ｜ 国際比較のための教育制度図</text><text x="42" y="90.2" font-size="32" fill="#243746">01  日本：初等教育から高等教育・学び直しまで</text><text x="42" y="123.45" font-size="17" fill="#243746">中学校卒業後に、高校・高専・高等専修学校などへ分かれる。高等教育にも職業教育がある。</text><text x="42" y="141.35" font-size="11" fill="#243746">年齢は標準的な目安・配置例。入学年齢の制限や義務教育の範囲ではない。縦の順序は経路の優劣を表さない。</text><text x="42" y="1080.2" font-size="12" fill="#243746">制度の主な経路を整理した授業用図／2026年11月5日確認。掲載資料の版・州・課程の違いに注意。</text><text x="1495" y="1081.9" font-size="14" fill="#243746">1 / 4</text><text x="42" y="160.75" font-size="15" fill="#243746">年齢の目安 →</text><text x="237" y="159.05" font-size="13" fill="#243746">6</text><line x1="244" y1="173" x2="244" y2="744" stroke="#D9DFDA" /><text x="291" y="159.05" font-size="13" fill="#243746">7</text><line x1="298" y1="173" x2="298" y2="744" stroke="#D9DFDA" /><text x="345" y="159.05" font-size="13" fill="#243746">8</text><line x1="352" y1="173" x2="352" y2="744" stroke="#D9DFDA" /><text x="399" y="159.05" font-size="13" fill="#243746">9</text><line x1="406" y1="173" x2="406" y2="744" stroke="#D9DFDA" /><text x="453" y="159.05" font-size="13" fill="#243746">10</text><line x1="460" y1="173" x2="460" y2="744" stroke="#D9DFDA" /><text x="507" y="159.05" font-size="13" fill="#243746">11</text><line x1="514" y1="173" x2="514" y2="744" stroke="#D9DFDA" /><text x="561" y="159.05" font-size="13" fill="#243746">12</text><line x1="568" y1="173" x2="568" y2="744" stroke="#D9DFDA" /><text x="615" y="159.05" font-size="13" fill="#243746">13</text><line x1="622" y1="173" x2="622" y2="744" stroke="#D9DFDA" /><text x="669" y="159.05" font-size="13" fill="#243746">14</text><line x1="676" y1="173" x2="676" y2="744" stroke="#D9DFDA" /><text x="723" y="159.05" font-size="13" fill="#243746">15</text><line x1="730" y1="173" x2="730" y2="744" stroke="#D9DFDA" /><text x="777" y="159.05" font-size="13" fill="#243746">16</text><line x1="784" y1="173" x2="784" y2="744" stroke="#D9DFDA" /><text x="831" y="159.05" font-size="13" fill="#243746">17</text><line x1="838" y1="173" x2="838" y2="744" stroke="#D9DFDA" /><text x="885" y="159.05" font-size="13" fill="#243746">18</text><line x1="892" y1="173" x2="892" y2="744" stroke="#D9DFDA" /><text x="939" y="159.05" font-size="13" fill="#243746">19</text><line x1="946" y1="173" x2="946" y2="744" stroke="#D9DFDA" /><text x="993" y="159.05" font-size="13" fill="#243746">20</text><line x1="1000" y1="173" x2="1000" y2="744" stroke="#D9DFDA" /><text x="1047" y="159.05" font-size="13" fill="#243746">21</text><line x1="1054" y1="173" x2="1054" y2="744" stroke="#D9DFDA" /><text x="1101" y="159.05" font-size="13" fill="#243746">22</text><line x1="1108" y1="173" x2="1108" y2="744" stroke="#D9DFDA" /><text x="1155" y="159.05" font-size="13" fill="#243746">23</text><line x1="1162" y1="173" x2="1162" y2="744" stroke="#D9DFDA" /><text x="1209" y="159.05" font-size="13" fill="#243746">24</text><line x1="1216" y1="173" x2="1216" y2="744" stroke="#D9DFDA" /><text x="1263" y="159.05" font-size="13" fill="#243746">25</text><line x1="1270" y1="173" x2="1270" y2="744" stroke="#D9DFDA" /><text x="1317" y="159.05" font-size="13" fill="#243746">26</text><line x1="1324" y1="173" x2="1324" y2="744" stroke="#D9DFDA" /><text x="1371" y="159.05" font-size="13" fill="#243746">27</text><line x1="1378" y1="173" x2="1378" y2="744" stroke="#D9DFDA" /><text x="1425" y="159.05" font-size="13" fill="#243746">28</text><line x1="1432" y1="173" x2="1432" y2="744" stroke="#D9DFDA" /><text x="1479" y="159.05" font-size="13" fill="#243746">29</text><line x1="1486" y1="173" x2="1486" y2="744" stroke="#D9DFDA" /><text x="1533" y="159.05" font-size="13" fill="#243746">30</text><line x1="1540" y1="173" x2="1540" y2="744" stroke="#D9DFDA" /><text x="42" y="209.6" font-size="16" fill="#243746">初等・前期中等</text><rect x="246" y="184" width="320" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="252" y="209.1" font-size="14" fill="#243746">小学校 6年</text><text x="252" y="225.9" font-size="14" fill="#243746">6〜12歳</text><rect x="570" y="184" width="158" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="576" y="209.1" font-size="14" fill="#243746">中学校 3年</text><text x="576" y="225.9" font-size="14" fill="#243746">12〜15歳</text><text x="42" y="279.6" font-size="16" fill="#243746">後期中等：高校</text><rect x="732" y="254" width="158" height="60" rx="5" fill="#DFECD9" stroke="#D9DFDA" /><text x="738" y="271.65000000000003" font-size="13.0" fill="#243746">高等学校（全日制3年）</text><text x="738" y="287.25000000000006" font-size="13.0" fill="#243746">普通・専門・総合</text><text x="738" y="302.85" font-size="13.0" fill="#243746">専門学科：工業・農業等</text><text x="42" y="349.6" font-size="16" fill="#243746">中等から一貫：高専</text><rect x="732" y="324" width="266" height="60" rx="5" fill="#DFECD9" stroke="#D9DFDA" /><text x="738" y="349.09999999999997" font-size="14" fill="#243746">【職業・専門】高等専門学校 本科5年</text><text x="738" y="365.9" font-size="14" fill="#243746">15〜20歳頃（商船は5年6か月）</text><rect x="1002" y="324" width="104" height="60" rx="5" fill="#DFECD9" stroke="#D9DFDA" /><text x="1008" y="349.09999999999997" font-size="14" fill="#243746">専攻科2年</text><text x="1008" y="365.9" font-size="14" fill="#243746">学士は要審査</text><text x="42" y="419.6" font-size="16" fill="#243746">後期中等：高等専修</text><rect x="732" y="394" width="158" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="738" y="410.7" font-size="14" fill="#243746">【職業】高等専修学校</text><text x="738" y="427.5" font-size="14" fill="#243746">専修学校高等課程</text><text x="738" y="444.3" font-size="14" fill="#243746">3年の課程の配置例</text><text x="42" y="489.6" font-size="16" fill="#243746">高等教育：大学・院</text><rect x="894" y="464" width="212" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="900" y="480.7" font-size="14" fill="#243746">大学 学士課程</text><text x="900" y="497.5" font-size="14" fill="#243746">標準4年</text><text x="900" y="514.3000000000001" font-size="14" fill="#243746">専門職養成分野もある</text><rect x="1110" y="464" width="104" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="1116" y="489.09999999999997" font-size="14" fill="#243746">修士課程</text><text x="1116" y="505.9" font-size="14" fill="#243746">標準2年</text><rect x="1218" y="464" width="158" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="1224" y="489.09999999999997" font-size="14" fill="#243746">博士後期課程</text><text x="1224" y="505.9" font-size="14" fill="#243746">標準3年</text><text x="42" y="559.6" font-size="16" fill="#243746">高等教育：専門職</text><rect x="894" y="534" width="212" height="60" rx="5" fill="#DFECD9" stroke="#D9DFDA" /><text x="900" y="559.1" font-size="14" fill="#243746">【職業】専門職大学</text><text x="900" y="575.9" font-size="14" fill="#243746">4年・学士（専門職）</text><rect x="1110" y="534" width="104" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="1116" y="559.1" font-size="14" fill="#243746">専門職大学院</text><text x="1116" y="575.9" font-size="14" fill="#243746">原則2年※</text><text x="42" y="629.6" font-size="16" fill="#243746">高等教育：短大等</text><rect x="894" y="604" width="158" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="900" y="622.6" font-size="12.0" fill="#243746">短期大学・専門職短期大学</text><text x="900" y="637.0" font-size="12.0" fill="#243746">2年または3年</text><text x="900" y="651.4" font-size="12.0" fill="#243746">職業教育を担う分野も多い</text><text x="42" y="699.6" font-size="16" fill="#243746">高等教育：専門学校</text><rect x="894" y="674" width="212" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="900" y="690.6999999999999" font-size="14" fill="#243746">【職業】専門学校</text><text x="900" y="707.4999999999999" font-size="14" fill="#243746">＝専修学校専門課程</text><text x="900" y="724.3" font-size="14" fill="#243746">18歳頃以後／期間は可変</text><rect x="42" y="756" width="1516" height="75" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="56" y="777.9" font-size="14" fill="#243746">主な接続  中学校等 → 高校・高専・高等専修学校 ／ 高校（専門学科も含む）等 → 大学・短大・専門学校</text><text x="56" y="809.9" font-size="14" fill="#243746">条件を確認する接続  高専・短大等 → 大学編入 ／ 高等専修学校の指定課程 → 大学入学資格 ／ 専門学校 → 編入・大学院入学資格（所定要件）</text><rect x="42" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="863.75" font-size="15" fill="#246A70">一貫教育・就学前</text><text x="54" y="883.88" font-size="12.8" fill="#243746">義務教育学校は小中9年。中等教育学校は中高6年。就学前には幼稚園・保育所・認定こども園等がある。</text><rect x="810" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="863.75" font-size="15" fill="#246A70">支援・学び直し</text><text x="822" y="883.88" font-size="12.8" fill="#243746">特別支援学校は小学部6〜12歳、中学部12〜15歳、高等部15〜18歳が標準。通常の学校でも支援を行う。定時制・通信制、再</text><text x="822" y="899.88" font-size="12.8" fill="#243746">入学等の経路もある。</text><rect x="42" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="940.75" font-size="15" fill="#246A70">年限・名称の注意</text><text x="54" y="960.88" font-size="12.8" fill="#243746">高校の定時制・通信制は3年以上。医・歯・臨床目的の薬・獣医の大学課程は6年。※法科大学院は原則3年。高等学校等にも</text><text x="54" y="976.88" font-size="12.8" fill="#243746">専攻科・別科がある。</text><rect x="810" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="940.75" font-size="15" fill="#246A70">年齢を固定しない教育</text><text x="822" y="960.88" font-size="12.8" fill="#243746">専修学校一般課程・各種学校、職業能力開発施設、省庁大学校、社会人向け教育等もある。所管・入学条件・取得資格はそれ</text><text x="822" y="976.88" font-size="12.8" fill="#243746">ぞれ確認する。</text><text x="42" y="1008.2" font-size="12" fill="#243746">凡例：青＝普通・基礎／緑＝職業教育を含む学校・課程等／紫＝主な学位課程／黄＝実務・準備。破線＝期間・年齢が可変、または配置例。</text><text x="42" y="1024.05" font-size="13" fill="#246A70">主な根拠（クリックで原資料へ。全URL・作図条件は同梱README）</text><text x="42" y="1045.775" font-size="11.5" fill="#243746">J1 文部科学省：学校系統図（2024掲載）</text><text x="278.75" y="1045.775" font-size="11.5" fill="#243746">J2 NIC-Japan：高等教育資格</text><text x="452.25" y="1045.775" font-size="11.5" fill="#243746">J3 NIC-Japan：高等教育機関への入学</text></svg>