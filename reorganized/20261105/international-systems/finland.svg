<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>教育制度と職業教育の位置づけ</title><style>text{font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic",sans-serif}</style><rect x="0" y="0" width="1600" height="1100" rx="5" fill="#F3F5F1" stroke="none" /><text x="42" y="41.6" font-size="16" fill="#246A70">工業科教育論Ⅱ ｜ 国際比較のための教育制度図</text><text x="42" y="90.2" font-size="32" fill="#243746">03  フィンランド：初等教育から高等教育・学び直しまで</text><text x="42" y="123.45" font-size="17" fill="#243746">7歳からの9年一貫の基礎教育後に普通教育・職業教育へ。職業資格からも高等教育への出願資格につながる。</text><text x="42" y="141.35" font-size="11" fill="#243746">年齢は標準的な目安・配置例。入学年齢の制限や義務教育の範囲ではない。縦の順序は経路の優劣を表さない。</text><text x="42" y="1080.2" font-size="12" fill="#243746">制度の主な経路を整理した授業用図／2026年11月5日確認。掲載資料の版・州・課程の違いに注意。</text><text x="1495" y="1081.9" font-size="14" fill="#243746">3 / 4</text><text x="42" y="160.75" font-size="15" fill="#243746">年齢の目安 →</text><text x="237" y="159.05" font-size="13" fill="#243746">6</text><line x1="244" y1="173" x2="244" y2="744" stroke="#D9DFDA" /><text x="291" y="159.05" font-size="13" fill="#243746">7</text><line x1="298" y1="173" x2="298" y2="744" stroke="#D9DFDA" /><text x="345" y="159.05" font-size="13" fill="#243746">8</text><line x1="352" y1="173" x2="352" y2="744" stroke="#D9DFDA" /><text x="399" y="159.05" font-size="13" fill="#243746">9</text><line x1="406" y1="173" x2="406" y2="744" stroke="#D9DFDA" /><text x="453" y="159.05" font-size="13" fill="#243746">10</text><line x1="460" y1="173" x2="460" y2="744" stroke="#D9DFDA" /><text x="507" y="159.05" font-size="13" fill="#243746">11</text><line x1="514" y1="173" x2="514" y2="744" stroke="#D9DFDA" /><text x="561" y="159.05" font-size="13" fill="#243746">12</text><line x1="568" y1="173" x2="568" y2="744" stroke="#D9DFDA" /><text x="615" y="159.05" font-size="13" fill="#243746">13</text><line x1="622" y1="173" x2="622" y2="744" stroke="#D9DFDA" /><text x="669" y="159.05" font-size="13" fill="#243746">14</text><line x1="676" y1="173" x2="676" y2="744" stroke="#D9DFDA" /><text x="723" y="159.05" font-size="13" fill="#243746">15</text><line x1="730" y1="173" x2="730" y2="744" stroke="#D9DFDA" /><text x="777" y="159.05" font-size="13" fill="#243746">16</text><line x1="784" y1="173" x2="784" y2="744" stroke="#D9DFDA" /><text x="831" y="159.05" font-size="13" fill="#243746">17</text><line x1="838" y1="173" x2="838" y2="744" stroke="#D9DFDA" /><text x="885" y="159.05" font-size="13" fill="#243746">18</text><line x1="892" y1="173" x2="892" y2="744" stroke="#D9DFDA" /><text x="939" y="159.05" font-size="13" fill="#243746">19</text><line x1="946" y1="173" x2="946" y2="744" stroke="#D9DFDA" /><text x="993" y="159.05" font-size="13" fill="#243746">20</text><line x1="1000" y1="173" x2="1000" y2="744" stroke="#D9DFDA" /><text x="1047" y="159.05" font-size="13" fill="#243746">21</text><line x1="1054" y1="173" x2="1054" y2="744" stroke="#D9DFDA" /><text x="1101" y="159.05" font-size="13" fill="#243746">22</text><line x1="1108" y1="173" x2="1108" y2="744" stroke="#D9DFDA" /><text x="1155" y="159.05" font-size="13" fill="#243746">23</text><line x1="1162" y1="173" x2="1162" y2="744" stroke="#D9DFDA" /><text x="1209" y="159.05" font-size="13" fill="#243746">24</text><line x1="1216" y1="173" x2="1216" y2="744" stroke="#D9DFDA" /><text x="1263" y="159.05" font-size="13" fill="#243746">25</text><line x1="1270" y1="173" x2="1270" y2="744" stroke="#D9DFDA" /><text x="1317" y="159.05" font-size="13" fill="#243746">26</text><line x1="1324" y1="173" x2="1324" y2="744" stroke="#D9DFDA" /><text x="1371" y="159.05" font-size="13" fill="#243746">27</text><line x1="1378" y1="173" x2="1378" y2="744" stroke="#D9DFDA" /><text x="1425" y="159.05" font-size="13" fill="#243746">28</text><line x1="1432" y1="173" x2="1432" y2="744" stroke="#D9DFDA" /><text x="1479" y="159.05" font-size="13" fill="#243746">29</text><line x1="1486" y1="173" x2="1486" y2="744" stroke="#D9DFDA" /><text x="1533" y="159.05" font-size="13" fill="#243746">30</text><line x1="1540" y1="173" x2="1540" y2="744" stroke="#D9DFDA" /><text x="42" y="209.6" font-size="16" fill="#243746">就学前・基礎教育</text><rect x="246" y="184" width="50" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="252" y="209.79999999999998" font-size="12" fill="#243746">6歳</text><text x="252" y="224.2" font-size="12" fill="#243746">就学前</text><rect x="300" y="184" width="482" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="306" y="209.1" font-size="14" fill="#243746">基礎教育：Comprehensive school 9年（1〜9学年）</text><text x="306" y="225.9" font-size="14" fill="#243746">7〜16歳／初等と前期中等を一体的に提供</text><text x="42" y="279.6" font-size="16" fill="#243746">後期中等：普通教育</text><rect x="786" y="254" width="158" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="792" y="273.075" font-size="11.5" fill="#243746">普通後期中等教育</text><text x="792" y="286.875" font-size="11.5" fill="#243746">通常3年／大学入学資格試験</text><text x="792" y="300.675" font-size="11.5" fill="#243746">期間の延長・短縮もある</text><text x="42" y="349.6" font-size="16" fill="#243746">後期中等：職業教育</text><rect x="786" y="324" width="185.0" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="340.7" font-size="14" fill="#243746">【職業】初期職業資格へ</text><text x="792" y="357.5" font-size="14" fill="#243746">個別計画・既習の認定</text><text x="792" y="374.3" font-size="14" fill="#243746">開始16歳頃〜／期間は可変</text><text x="42" y="419.6" font-size="16" fill="#243746">進学準備：TUVA</text><rect x="786" y="394" width="50" height="60" rx="5" fill="#F3E6CD" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="419.8" font-size="12" fill="#243746">最長</text><text x="792" y="434.2" font-size="12" fill="#243746">1学年</text><text x="42" y="489.6" font-size="16" fill="#243746">高等教育：大学</text><rect x="948" y="464" width="158" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="954" y="489.09999999999997" font-size="14" fill="#243746">大学 Bachelor</text><text x="954" y="505.9" font-size="14" fill="#243746">通常3年</text><rect x="1110" y="464" width="104" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="1116" y="489.09999999999997" font-size="14" fill="#243746">大学 Master</text><text x="1116" y="505.9" font-size="14" fill="#243746">通常2年</text><rect x="1218" y="464" width="212" height="60" rx="5" fill="#E5E1F0" stroke="#D9DFDA" /><text x="1224" y="480.7" font-size="14" fill="#243746">大学 博士課程</text><text x="1224" y="497.5" font-size="14" fill="#243746">通常約4年</text><text x="1224" y="514.3000000000001" font-size="14" fill="#243746">開始年齢は一例</text><text x="42" y="559.6" font-size="16" fill="#243746">高等教育：UAS</text><rect x="948" y="534" width="212" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="954" y="551.65" font-size="13.0" fill="#243746">【職業・専門】応用科学大学 UAS</text><text x="954" y="567.25" font-size="13.0" fill="#243746">学士3.5〜4.5年</text><text x="954" y="582.85" font-size="13.0" fill="#243746">図は4年で終える配置例</text><rect x="1164" y="534" width="104" height="60" rx="5" fill="#F3E6CD" stroke="#246A70" stroke-dasharray="5 4" /><text x="1170" y="559.1" font-size="14" fill="#243746">関連実務経験</text><text x="1170" y="575.9" font-size="14" fill="#243746">原則2年以上</text><rect x="1272" y="534" width="77.0" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="1278" y="559.1" font-size="14" fill="#243746">UAS修士</text><text x="1278" y="575.9" font-size="14" fill="#243746">1〜1.5年</text><text x="42" y="629.6" font-size="16" fill="#243746">職業教育の学ぶ場</text><rect x="786" y="604" width="752" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="620.6999999999999" font-size="14" fill="#243746">【職業】教育機関での学習 ＋ 職場での学習を組み合わせる／若者・成人の双方が対象</text><text x="792" y="637.4999999999999" font-size="14" fill="#243746">apprenticeship：雇用契約あり ／ training agreement：雇用契約を伴わない（この帯は在籍年齢や修業年限を表さ</text><text x="792" y="654.3" font-size="14" fill="#243746">ない）</text><text x="42" y="699.6" font-size="16" fill="#243746">成人・継続の職業資格</text><rect x="786" y="674" width="752" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="699.1" font-size="14" fill="#243746">【職業】Further vocational qualifications ／ Specialist vocational qualifications</text><text x="792" y="715.9" font-size="14" fill="#243746">専門性を深める職業資格。開始年齢・順序・期間は固定しない（この帯は在籍年齢や修業年限を表さない）</text><rect x="42" y="756" width="1516" height="75" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="56" y="777.9" font-size="14" fill="#243746">主な接続  基礎教育 → 普通後期中等教育 または 職業教育 ／ いずれからも大学・UASへの出願資格へ（選抜・個別要件あり）</text><text x="56" y="809.9" font-size="14" fill="#243746">継続の例  基礎教育 → TUVA → 普通教育／職業教育 ／ UAS学士 → 関連実務経験2年以上 → UAS修士（入学要件を別途確認）</text><rect x="42" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="863.75" font-size="15" fill="#246A70">就学前・支援</text><text x="54" y="883.88" font-size="12.8" fill="#243746">6歳の就学前教育の前には幼児教育・保育がある。通常の学習環境での支援と専門的な支援があり、必要に応じて学びを調整</text><text x="54" y="899.88" font-size="12.8" fill="#243746">する。</text><rect x="810" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="863.75" font-size="15" fill="#246A70">個別の進度と準備教育</text><text x="822" y="883.88" font-size="12.8" fill="#243746">VETは必要な能力を個別計画で確認し、既習も認定する。TUVAは普通・職業の後期中等教育への準備で最長1学年。図の開始16</text><text x="822" y="899.88" font-size="12.8" fill="#243746">歳は例。</text><rect x="42" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="940.75" font-size="15" fill="#246A70">学位取得後の経路</text><text x="54" y="960.88" font-size="12.8" fill="#243746">大学には博士・Licentiateの経路がある。UAS修士等からの博士課程への出願は大学側の適格性判断・選抜等があり、自動的</text><text x="54" y="976.88" font-size="12.8" fill="#243746">には進まない。</text><rect x="810" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="940.75" font-size="15" fill="#246A70">成人・再学習</text><text x="822" y="960.88" font-size="12.8" fill="#243746">VETには初期・継続・専門の資格がある。若者にも成人にも開かれ、能力の獲得・更新を支える。成人普通教育やリベラル成</text><text x="822" y="976.88" font-size="12.8" fill="#243746">人教育等もある。</text><text x="42" y="1008.2" font-size="12" fill="#243746">凡例：青＝普通・基礎／緑＝職業教育を含む学校・課程等／紫＝主な学位課程／黄＝実務・準備。破線＝期間・年齢が可変、または配置例。</text><text x="42" y="1024.05" font-size="13" fill="#246A70">主な根拠（クリックで原資料へ。全URL・作図条件は同梱README）</text><text x="42" y="1045.775" font-size="11.5" fill="#243746">F1 OPH：教育制度図（2026）</text><text x="215.5" y="1045.775" font-size="11.5" fill="#243746">F2 OPH：初等・前期中等教育</text><text x="389.0" y="1045.775" font-size="11.5" fill="#243746">F3 OPH：後期中等普通教育</text><text x="551.0" y="1045.775" font-size="11.5" fill="#243746">F4 OPH：職業教育・訓練</text><text x="701.5" y="1045.775" font-size="11.5" fill="#243746">F5 EDUFI Study in Finland：大学・学位と期間（2026更新）</text><text x="1041.75" y="1045.775" font-size="11.5" fill="#243746">F6 Helsinki市：TUVA進学準備教育</text><text x="1244.0" y="1045.775" font-size="11.5" fill="#243746">F7 OECD：フィンランドのVET（2025）</text></svg>