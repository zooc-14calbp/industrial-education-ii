<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>教育制度と職業教育の位置づけ</title><style>text{font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic",sans-serif}</style><rect x="0" y="0" width="1600" height="1100" rx="5" fill="#F3F5F1" stroke="none" /><text x="42" y="41.6" font-size="16" fill="#246A70">工業科教育論Ⅱ ｜ 国際比較のための教育制度図</text><text x="42" y="90.2" font-size="32" fill="#243746">02  ドイツ：初等教育から高等教育・学び直しまで</text><text x="42" y="123.45" font-size="17" fill="#243746">初等教育後の分岐が比較的早い。州ごとに学校名・編成が異なり、学校と企業の双方が職業教育を担う。</text><text x="42" y="141.35" font-size="11" fill="#243746">年齢は標準的な目安・配置例。入学年齢の制限や義務教育の範囲ではない。縦の順序は経路の優劣を表さない。</text><text x="42" y="1080.2" font-size="12" fill="#243746">制度の主な経路を整理した授業用図／2026年11月5日確認。掲載資料の版・州・課程の違いに注意。</text><text x="1495" y="1081.9" font-size="14" fill="#243746">2 / 4</text><text x="42" y="160.75" font-size="15" fill="#243746">年齢の目安 →</text><text x="237" y="159.05" font-size="13" fill="#243746">6</text><line x1="244" y1="173" x2="244" y2="744" stroke="#D9DFDA" /><text x="291" y="159.05" font-size="13" fill="#243746">7</text><line x1="298" y1="173" x2="298" y2="744" stroke="#D9DFDA" /><text x="345" y="159.05" font-size="13" fill="#243746">8</text><line x1="352" y1="173" x2="352" y2="744" stroke="#D9DFDA" /><text x="399" y="159.05" font-size="13" fill="#243746">9</text><line x1="406" y1="173" x2="406" y2="744" stroke="#D9DFDA" /><text x="453" y="159.05" font-size="13" fill="#243746">10</text><line x1="460" y1="173" x2="460" y2="744" stroke="#D9DFDA" /><text x="507" y="159.05" font-size="13" fill="#243746">11</text><line x1="514" y1="173" x2="514" y2="744" stroke="#D9DFDA" /><text x="561" y="159.05" font-size="13" fill="#243746">12</text><line x1="568" y1="173" x2="568" y2="744" stroke="#D9DFDA" /><text x="615" y="159.05" font-size="13" fill="#243746">13</text><line x1="622" y1="173" x2="622" y2="744" stroke="#D9DFDA" /><text x="669" y="159.05" font-size="13" fill="#243746">14</text><line x1="676" y1="173" x2="676" y2="744" stroke="#D9DFDA" /><text x="723" y="159.05" font-size="13" fill="#243746">15</text><line x1="730" y1="173" x2="730" y2="744" stroke="#D9DFDA" /><text x="777" y="159.05" font-size="13" fill="#243746">16</text><line x1="784" y1="173" x2="784" y2="744" stroke="#D9DFDA" /><text x="831" y="159.05" font-size="13" fill="#243746">17</text><line x1="838" y1="173" x2="838" y2="744" stroke="#D9DFDA" /><text x="885" y="159.05" font-size="13" fill="#243746">18</text><line x1="892" y1="173" x2="892" y2="744" stroke="#D9DFDA" /><text x="939" y="159.05" font-size="13" fill="#243746">19</text><line x1="946" y1="173" x2="946" y2="744" stroke="#D9DFDA" /><text x="993" y="159.05" font-size="13" fill="#243746">20</text><line x1="1000" y1="173" x2="1000" y2="744" stroke="#D9DFDA" /><text x="1047" y="159.05" font-size="13" fill="#243746">21</text><line x1="1054" y1="173" x2="1054" y2="744" stroke="#D9DFDA" /><text x="1101" y="159.05" font-size="13" fill="#243746">22</text><line x1="1108" y1="173" x2="1108" y2="744" stroke="#D9DFDA" /><text x="1155" y="159.05" font-size="13" fill="#243746">23</text><line x1="1162" y1="173" x2="1162" y2="744" stroke="#D9DFDA" /><text x="1209" y="159.05" font-size="13" fill="#243746">24</text><line x1="1216" y1="173" x2="1216" y2="744" stroke="#D9DFDA" /><text x="1263" y="159.05" font-size="13" fill="#243746">25</text><line x1="1270" y1="173" x2="1270" y2="744" stroke="#D9DFDA" /><text x="1317" y="159.05" font-size="13" fill="#243746">26</text><line x1="1324" y1="173" x2="1324" y2="744" stroke="#D9DFDA" /><text x="1371" y="159.05" font-size="13" fill="#243746">27</text><line x1="1378" y1="173" x2="1378" y2="744" stroke="#D9DFDA" /><text x="1425" y="159.05" font-size="13" fill="#243746">28</text><line x1="1432" y1="173" x2="1432" y2="744" stroke="#D9DFDA" /><text x="1479" y="159.05" font-size="13" fill="#243746">29</text><line x1="1486" y1="173" x2="1486" y2="744" stroke="#D9DFDA" /><text x="1533" y="159.05" font-size="13" fill="#243746">30</text><line x1="1540" y1="173" x2="1540" y2="744" stroke="#D9DFDA" /><text x="42" y="209.6" font-size="16" fill="#243746">初等：Grundschule</text><rect x="246" y="184" width="212" height="60" rx="5" fill="#E3EBF1" stroke="#D9DFDA" /><text x="252" y="209.1" font-size="14" fill="#243746">基礎学校 通常4年</text><text x="252" y="225.9" font-size="14" fill="#243746">6〜10歳</text><rect x="462" y="184" width="104" height="60" rx="5" fill="#E3EBF1" stroke="#246A70" stroke-dasharray="5 4" /><text x="468" y="209.1" font-size="14" fill="#243746">一部の州</text><text x="468" y="225.9" font-size="14" fill="#243746">は6年制</text><text x="42" y="279.6" font-size="16" fill="#243746">中等：Gymnasium</text><rect x="462" y="254" width="320" height="60" rx="5" fill="#E3EBF1" stroke="#246A70" stroke-dasharray="5 4" /><text x="468" y="279.09999999999997" font-size="14" fill="#243746">ギムナジウム等 前期中等段階</text><text x="468" y="295.9" font-size="14" fill="#243746">10〜15/16歳頃（州・制度による）</text><rect x="786" y="254" width="158" height="60" rx="5" fill="#E3EBF1" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="270.7" font-size="14" fill="#243746">上級段階</text><text x="792" y="287.5" font-size="14" fill="#243746">Abiturへ</text><text x="792" y="304.3" font-size="14" fill="#243746">修了18/19歳頃</text><text x="42" y="349.6" font-size="16" fill="#243746">中等：その他の経路</text><rect x="462" y="324" width="320" height="60" rx="5" fill="#E3EBF1" stroke="#246A70" stroke-dasharray="5 4" /><text x="468" y="340.7" font-size="14" fill="#243746">Hauptschule・Realschule等</text><text x="468" y="357.5" font-size="14" fill="#243746">統合型／総合制の学校もある</text><text x="468" y="374.3" font-size="14" fill="#243746">修了15/16歳頃／州によって編成が異なる</text><text x="42" y="419.6" font-size="16" fill="#243746">後期中等：デュアル</text><rect x="732" y="394" width="239.0" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="738" y="410.7" font-size="14" fill="#243746">【職業】企業の訓練＋職業学校</text><text x="738" y="427.5" font-size="14" fill="#243746">通常2〜3.5年／訓練契約</text><text x="738" y="444.3" font-size="14" fill="#243746">15/16歳頃以後の配置例</text><text x="42" y="489.6" font-size="16" fill="#243746">後期中等：学校中心</text><rect x="732" y="464" width="239.0" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="738" y="480.7" font-size="14" fill="#243746">【職業】Berufsfachschule等</text><text x="738" y="497.5" font-size="14" fill="#243746">学校中心の職業教育／実習もある</text><text x="738" y="514.3000000000001" font-size="14" fill="#243746">入学条件・期間は課程ごとに異なる</text><text x="42" y="559.6" font-size="16" fill="#243746">職業系の進学経路</text><rect x="786" y="534" width="185.0" height="60" rx="5" fill="#DFECD9" stroke="#246A70" stroke-dasharray="5 4" /><text x="792" y="546.95" font-size="11.0" fill="#243746">職業ギムナジウム・FOS・BOS等</text><text x="792" y="560.1500000000001" font-size="11.0" fill="#243746">職業分野の学習と高等教育への接</text><text x="792" y="573.35" font-size="11.0" fill="#243746">続</text><text x="792" y="586.5500000000001" font-size="11.0" fill="#243746">要件・開始時点は異なる</text><text x="42" y="629.6" font-size="16" fill="#243746">高等教育：大学等</text><rect x="948" y="604" width="158" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="954" y="629.1" font-size="14" fill="#243746">大学等 学士課程</text><text x="954" y="645.9" font-size="14" fill="#243746">通常3年の配置例</text><rect x="1110" y="604" width="104" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="1116" y="629.1" font-size="14" fill="#243746">修士課程</text><text x="1116" y="645.9" font-size="14" fill="#243746">1〜2年</text><rect x="1218" y="604" width="320" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="1224" y="629.1" font-size="14" fill="#243746">博士取得へ（大学等）</text><text x="1224" y="645.9" font-size="14" fill="#243746">研究・審査／期間と開始年齢は固定しない</text><text x="42" y="699.6" font-size="16" fill="#243746">高等教育：応用科学</text><rect x="948" y="674" width="185.0" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="954" y="690.6999999999999" font-size="14" fill="#243746">応用科学系大学 HAW/FH等</text><text x="954" y="707.4999999999999" font-size="14" fill="#243746">学士3〜4年</text><text x="954" y="724.3" font-size="14" fill="#243746">図は3.5年の配置例</text><rect x="1137.0" y="674" width="77.0" height="60" rx="5" fill="#E5E1F0" stroke="#246A70" stroke-dasharray="5 4" /><text x="1143.0" y="699.1" font-size="14" fill="#243746">修士課程</text><text x="1143.0" y="715.9" font-size="14" fill="#243746">1〜2年</text><rect x="42" y="756" width="1516" height="75" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="56" y="777.9" font-size="14" fill="#243746">主な接続  基礎学校 → 前期中等の各経路 → 上級段階／職業教育 ／ 高等教育入学資格 → 大学・HAW/FH等</text><text x="56" y="809.9" font-size="14" fill="#243746">学びの継続  職業資格・経験 → Fachschule／Meister等の上級職業教育 ／ 職業経験等から高等教育へ進む経路もある（州・課程の条件を確認）</text><rect x="42" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="863.75" font-size="15" fill="#246A70">州差・年齢差</text><text x="54" y="883.88" font-size="12.8" fill="#243746">基礎学校はベルリン・ブランデンブルクでは6年。図の10歳からの分岐は通常の4年制の例。Gymnasiumは通算12/13学年等の違</text><text x="54" y="899.88" font-size="12.8" fill="#243746">いがある。</text><rect x="810" y="844" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="863.75" font-size="15" fill="#246A70">就学前・移行の支援</text><text x="822" y="883.88" font-size="12.8" fill="#243746">就学前施設、学校での支援・特別支援教育、職業教育に移るための準備教育がある。学校種の変更や成人の資格取得・第二の</text><text x="822" y="899.88" font-size="12.8" fill="#243746">教育経路もある。</text><rect x="42" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="54" y="940.75" font-size="15" fill="#246A70">職業教育の継続</text><text x="54" y="960.88" font-size="12.8" fill="#243746">Fachschule、Meister等は職業教育・実務経験等を基礎に専門性を高める経路。年齢は一定しない。職業資格と大学の学位は</text><text x="54" y="976.88" font-size="12.8" fill="#243746">区別する。</text><rect x="810" y="921" width="748" height="69" rx="5" fill="#FFFFFF" stroke="none" /><text x="822" y="940.75" font-size="15" fill="#246A70">高等教育の多様性</text><text x="822" y="960.88" font-size="12.8" fill="#243746">芸術・音楽系大学、デュアル型高等教育、国家試験につながる課程等もある。博士取得の方法・授与権限は州・機関で異なる</text><text x="822" y="976.88" font-size="12.8" fill="#243746">。HAW/FHからの接続も要確認。</text><text x="42" y="1008.2" font-size="12" fill="#243746">凡例：青＝普通・基礎／緑＝職業教育を含む学校・課程等／紫＝主な学位課程／黄＝実務・準備。破線＝期間・年齢が可変、または配置例。</text><text x="42" y="1024.05" font-size="13" fill="#246A70">主な根拠（クリックで原資料へ。全URL・作図条件は同梱README）</text><text x="42" y="1045.775" font-size="11.5" fill="#243746">D1 KMK：2024/2025教育制度・初等教育</text><text x="267.25" y="1045.775" font-size="11.5" fill="#243746">D2 KMK：2024/2025教育制度・中等教育</text><text x="492.5" y="1045.775" font-size="11.5" fill="#243746">D3 KMK：2024/2025教育制度・高等教育</text><text x="717.75" y="1045.775" font-size="11.5" fill="#243746">D4 BIBB：デュアル制度の構造</text></svg>