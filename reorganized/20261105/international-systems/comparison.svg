<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>教育制度と職業教育の位置づけ</title><style>text{font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic",sans-serif}</style><rect x="0" y="0" width="1600" height="1100" rx="5" fill="#F3F5F1" stroke="none" /><text x="42" y="41.6" font-size="16" fill="#246A70">工業科教育論Ⅱ ｜ 国際比較のための教育制度図</text><text x="42" y="90.2" font-size="32" fill="#243746">04  図の読み方：職業教育を「いつ・どこで・その後」で比べる</text><text x="42" y="123.45" font-size="17" fill="#243746">比較対象は日本・ドイツ・フィンランドの3か国。全OECD加盟国や、各州・全課程の詳細を網羅した図ではありません。</text><text x="42" y="1080.2" font-size="12" fill="#243746">制度の主な経路を整理した授業用図／2026年11月5日確認。掲載資料の版・州・課程の違いに注意。</text><text x="1495" y="1081.9" font-size="14" fill="#243746">4 / 4</text><rect x="42" y="159" width="1516" height="104" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="60" y="188.3" font-size="18" fill="#246A70">最初に確認：年齢の横軸は、標準的な進み方と配置例を示す。入学年齢の制限や義務教育の範囲を示すものではない。</text><text x="60" y="220.6" font-size="16" fill="#243746">初等・前期中等・後期中等・高等教育は学習段階の呼び方。日本の「高校」「大学」という学校名を、そのまま他国の学校名に当てはめない。</text><text x="60" y="243.6" font-size="16" fill="#243746">職業教育（VET）は職業に関わる知識・技能を育てる教育・訓練。後期中等にも高等教育にも、成人の学び直しにも位置づく。</text><rect x="42" y="286" width="308" height="39" rx="5" fill="#246A70" stroke="none" /><text x="54" y="311.15" font-size="19" fill="#FFFFFF">比べる問い</text><rect x="362" y="286" width="386" height="39" rx="5" fill="#246A70" stroke="none" /><text x="374" y="311.15" font-size="19" fill="#FFFFFF">日本</text><rect x="760" y="286" width="386" height="39" rx="5" fill="#246A70" stroke="none" /><text x="772" y="311.15" font-size="19" fill="#FFFFFF">ドイツ</text><rect x="1158" y="286" width="400" height="39" rx="5" fill="#246A70" stroke="none" /><text x="1170" y="311.15" font-size="19" fill="#FFFFFF">フィンランド</text><rect x="42" y="333" width="308" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="54" y="358.6" font-size="16" fill="#243746">初等・前期中等の構造</text><rect x="362" y="333" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="374" y="358.6" font-size="16" fill="#243746">6歳から小学校6年、中学校3年。義務教育学校等も</text><text x="374" y="380.6" font-size="16" fill="#243746">ある。</text><rect x="760" y="333" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="772" y="358.6" font-size="16" fill="#243746">通常6歳から基礎学校4年。その後の学校・課程は</text><text x="772" y="380.6" font-size="16" fill="#243746">複数。州による違いがある。</text><rect x="1158" y="333" width="400" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="1170" y="358.6" font-size="16" fill="#243746">7歳から9年一貫の基礎教育。6歳に就学前教育。</text><rect x="42" y="427" width="308" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="54" y="452.6" font-size="16" fill="#243746">職業教育へ進む時期</text><rect x="362" y="427" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="374" y="452.6" font-size="16" fill="#243746">主に中学校卒業の15歳頃から。専門高校・高専・</text><text x="374" y="474.6" font-size="16" fill="#243746">高等専修学校等。</text><rect x="760" y="427" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="772" y="452.6" font-size="16" fill="#243746">初等後の分岐と、職業教育への移行時期は別。デ</text><text x="772" y="474.6" font-size="16" fill="#243746">ュアル等は前期中等以後が中心。</text><rect x="1158" y="427" width="400" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="1170" y="452.6" font-size="16" fill="#243746">主に基礎教育後の16歳頃から。普通後期中等教育と</text><text x="1170" y="474.6" font-size="16" fill="#243746">職業教育の経路がある。</text><rect x="42" y="521" width="308" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="54" y="546.6" font-size="16" fill="#243746">学校と職場の関係</text><rect x="362" y="521" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="374" y="546.6" font-size="16" fill="#243746">学校での専門学習・実習、企業等との連携。課程</text><text x="374" y="568.6" font-size="16" fill="#243746">・学校で構成は異なる。</text><rect x="760" y="521" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="772" y="546.6" font-size="16" fill="#243746">デュアルは企業の訓練と職業学校。学校中心の職</text><text x="772" y="568.6" font-size="16" fill="#243746">業教育も併存する。</text><rect x="1158" y="521" width="400" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="1170" y="546.6" font-size="16" fill="#243746">個別計画に基づき学校と職場を組み合わせる。雇用</text><text x="1170" y="568.6" font-size="16" fill="#243746">契約の有無が異なる学習形態もある。</text><rect x="42" y="615" width="308" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="54" y="640.6" font-size="16" fill="#243746">高等教育との接続</text><rect x="362" y="615" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="374" y="640.6" font-size="16" fill="#243746">専門高校からも大学等へ。高専・短大等から編入</text><text x="374" y="662.6" font-size="16" fill="#243746">、専門学校からの接続には所定要件。</text><rect x="760" y="615" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="772" y="640.6" font-size="16" fill="#243746">進学資格や職業資格・経験による経路がある。州</text><text x="772" y="662.6" font-size="16" fill="#243746">・分野・課程による条件の確認が必要。</text><rect x="1158" y="615" width="400" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="1170" y="640.6" font-size="16" fill="#243746">職業資格も大学・UASへの出願資格につながる。入学</text><text x="1170" y="662.6" font-size="16" fill="#243746">の選抜は別にある。</text><rect x="42" y="709" width="308" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="54" y="734.6" font-size="16" fill="#243746">年齢を固定できない部分</text><rect x="362" y="709" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="374" y="734.6" font-size="16" fill="#243746">定時制・通信制、成人の再入学、専門学校や職業</text><text x="374" y="756.6" font-size="16" fill="#243746">訓練等の期間。</text><rect x="760" y="709" width="386" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="772" y="734.6" font-size="16" fill="#243746">訓練契約の開始時期、上級職業教育、成人の再学</text><text x="772" y="756.6" font-size="16" fill="#243746">習、博士研究等。</text><rect x="1158" y="709" width="400" height="87" rx="5" fill="#FFFFFF" stroke="#D9DFDA" /><text x="1170" y="734.6" font-size="16" fill="#243746">VETの個別進度、継続・専門の職業資格、実務経験後</text><text x="1170" y="756.6" font-size="16" fill="#243746">のUAS修士等。</text><rect x="42" y="820" width="1516" height="80" rx="5" fill="#F3E6CD" stroke="none" /><text x="58" y="848.0" font-size="20" fill="#243746">考える時間 ｜ 同じ15歳の架空の生徒に、3か国で今後どのような学びの経路を説明できるか。</text><text x="58" y="875.75" font-size="15" fill="#243746">図から選択肢を一つずつたどり、「職業教育を受ける場」「高等教育への接続」「追加確認が必要な条件」を短く整理する。提出不要。本人や家族の経験を書く必要はない。</text><text x="42" y="931.6" font-size="16" fill="#243746">図を使う際の注意：箱の幅は学生数・進学率を表さない。矢印は進学の保証ではない。職業資格・学位・免許はそれぞれ異なる。</text><text x="42" y="955.6" font-size="16" fill="#243746">学校種や経路に優劣をつけず、本人が選び直せる経路と、学び続けるための条件に目を向ける。支援は一部の経路だけに限定されない。</text><text x="42" y="979.6" font-size="16" fill="#243746">この教材は制度の位置関係を読む資料。各国の就学義務・学費・個別の受験資格を判断する場合は、現行法令・機関の案内を確認する。</text><text x="42" y="1024.05" font-size="13" fill="#246A70">主な根拠（クリックで原資料へ。全URL・作図条件は同梱README）</text><text x="42" y="1045.775" font-size="11.5" fill="#243746">O1 OECD：職業教育・訓練（VET）</text><text x="238.5" y="1045.775" font-size="11.5" fill="#243746">O2 OECD：Education at a Glance 2026・Readers Guide</text></svg>